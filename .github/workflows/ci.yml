name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Compilar todos los .py
        run: python -m py_compile *.py tests/*.py
      - name: Verificar mapa de registros
        run: python -c "from registros_pm556x import REGISTROS; assert len(REGISTROS) > 0; print(len(REGISTROS), 'registros')"
      - name: Pruebas con medidor sintético
        run: python -m pytest -q tests
