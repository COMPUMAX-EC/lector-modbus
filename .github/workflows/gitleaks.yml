name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The binary is used directly (the gitleaks-action needs a license for organizations).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the full git history
        run: ./gitleaks detect --source . --log-opts="--all" --redact --verbose

      - name: No hardcoded meter IP in tracked code
        run: |
          if git grep -nE '192\.168\.[0-9]+\.[0-9]+' -- '*.py' '*.spec' '*.md' '*.example'; then
            echo "Private LAN IP found in tracked files: move it to config.ini"; exit 1
          fi
